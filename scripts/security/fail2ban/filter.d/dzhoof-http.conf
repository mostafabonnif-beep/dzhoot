# fail2ban filter for the DZ HOOF Caddy access log (JSON encoder).
#
# Install to /etc/fail2ban/filter.d/dzhoof-http.conf — see
# scripts/security/setup-fail2ban-http-jail.sh, which installs and validates it.
#
# The jail this belongs to was previously defined only on the production host, so a
# fresh deploy had an unwatched access log (the Caddyfile used to say so). This file is
# the versioned definition; the host copy should be replaced by it.
#
# Log shape (Caddy `format json`, one entry per line). Key order matters for these
# regexes, so it is documented here as observed on 2026-09-15:
#
#   {"level":…,"ts":…,"logger":…,"msg":"handled request",
#    "request":{"remote_ip":…,"client_ip":"…","proto":…,"method":"POST","host":…,
#               "uri":"/","headers":{…,"Next-Action":["x"]},"tls":{…}},
#    "bytes_read":…,"duration":…,"size":…,"status":404,"resp_headers":{…}}
#
# `client_ip` comes first and `status` last, which is what lets one line be matched
# without multi-line anchors.

[Definition]

# 1) Auth failures — the original rule, unchanged: 6x 401/403 in 60s bans for an hour.
failregex = ^.*"client_ip":"<HOST>".*"status":40[13]\b.*

# Benign 401s that every anonymous browser produces by design. The SPA probes the
# session on load (`GET /auth/me`), calls `POST /auth/logout` even when there is no
# session to end, and the dashboard shell asks for the personal playlist before the
# visitor signs in. Those paths answer 401, not 403, and they are not an abuse
# signal — but they counted towards `maxretry`, so a handful of page loads or a few
# open tabs from one address reached 6/60s and banned a legitimate visitor for an
# hour (observed live: 6x `/auth/me` + 2x `/auth/logout` in one browsing session).
#
# Behind carrier NAT that is worse than a nuisance: the ban lands on a shared
# address and takes out every customer behind it, who see a TLS handshake failure
# rather than a 403.
#
# Only these read-only bootstrap paths are ignored, and only for 401 (a 403 keeps
# counting — that is an authenticated-but-forbidden or CSRF signal). Login brute
# force (`/auth/login`, `/jwt/login`, `/reseller/auth/login`), 2FA endpoints,
# `/admin/*` and `/users*` are unaffected, so the jail still catches real probing.
# (fail2ban allows a single `ignoreregex` option per section — this is the only one.)

# 2) Fabricated server-action requests. A real Next.js `Next-Action` id is exactly 42
#    characters long (SERVER_REFERENCE_ID_LENGTH); scanners send "x", "y", "0", "1" or
#    "action" and get a 404 from the framework (or a 400/429 from the middleware added
#    in the same change). The value length is bounded so a genuine request — which
#    always carries a 42-character id — can never match.
#    See server/frontend/src/lib/request-hygiene.ts.
            ^.*"client_ip":"<HOST>".*"Next-Action":\["[^"]{0,41}"\].*"status":(?:400|404|429)\b.*

ignoreregex = ^.*"client_ip":"<HOST>".*"uri":"/api/v1/auth/me".*"status":401\b.*
              ^.*"client_ip":"<HOST>".*"uri":"/api/v1/auth/logout".*"status":401\b.*
              ^.*"client_ip":"<HOST>".*"uri":"/api/v1/user-playlist/me/[^"]*".*"status":401\b.*

# Sample lines for `fail2ban-regex` (script validates the filter against the live log
# before reloading the jail):
#
#   {"level":"info","ts":1,"logger":"http.log.access.log0","msg":"handled request","request":{"remote_ip":"93.123.109.163","client_ip":"93.123.109.163","proto":"HTTP/1.1","method":"POST","host":"iptv.ld-11.net","uri":"/","headers":{"Next-Action":["x"]},"tls":{}},"bytes_read":5155,"duration":0.04,"size":24,"status":404,"resp_headers":{}}
