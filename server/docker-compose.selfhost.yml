services:
  api:
    image: ${DOCKER_IMAGE}
    container_name: dzhoof-api
    restart: unless-stopped
    # Keep the API internal; put Caddy/Nginx/Traefik in front for HTTPS.
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${APP_VERSION}
      MONGODB_URI: mongodb://mongodb:27017/dzhoof-iptv
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GH_OAUTH_CLIENT_ID: ${GH_OAUTH_CLIENT_ID}
      GH_OAUTH_CLIENT_SECRET: ${GH_OAUTH_CLIENT_SECRET}
      GH_OAUTH_REDIRECT_URI: ${GH_OAUTH_REDIRECT_URI}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_CHANNEL_LIST_CODE: ${SUPER_ADMIN_CHANNEL_LIST_CODE}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET}
      XTREAM_SECRET_KEY: ${XTREAM_SECRET_KEY}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      SUBSCRIPTION_REQUIRED: 'true'
      GH_APP_OWNER: ${GH_APP_OWNER}
      GH_APP_REPO: ${GH_APP_REPO}
      GH_APP_APK_PATTERN: ${GH_APP_APK_PATTERN}
      GH_APP_TOKEN: ${GH_APP_TOKEN}
      MAIL_PROVIDER: ${MAIL_PROVIDER}
      BREVO_HOST: ${BREVO_HOST}
      BREVO_PORT: ${BREVO_PORT}
      BREVO_USER: ${BREVO_USER}
      BREVO_PASSWORD: ${BREVO_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      APP_URL: ${APP_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      DISABLE_SCHEDULER: 'true'
    networks:
      - dzhoof-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  frontend:
    image: ${DOCKER_FRONTEND_IMAGE}
    container_name: dzhoof-frontend
    restart: unless-stopped
    expose:
      - '3000'
    networks:
      - dzhoof-network
    depends_on:
      api:
        condition: service_started
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  mongodb:
    image: mongo:7.0.19
    container_name: dzhoof-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - dzhoof-network
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7.2.5-alpine
    container_name: dzhoof-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - dzhoof-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  scheduler:
    image: ${DOCKER_IMAGE}
    container_name: dzhoof-scheduler
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/dzhoof-iptv
      REDIS_URL: redis://redis:6379
      LIVENESS_CHECK_INTERVAL_MS: ${LIVENESS_CHECK_INTERVAL_MS}
      EPG_REFRESH_INTERVAL_MS: ${EPG_REFRESH_INTERVAL_MS}
      CACHE_REFRESH_INTERVAL_MS: ${CACHE_REFRESH_INTERVAL_MS}
    command:
      [
        'sh',
        '-c',
        'echo "Waiting 5m for API to settle..." && sleep 300 && npx tsx backend/src/scheduler-entrypoint.ts',
      ]
    depends_on:
      - mongodb
      - redis
    networks:
      - dzhoof-network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

networks:
  dzhoof-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
