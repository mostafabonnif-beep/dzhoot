<h2>⚠️ تنبيه المصادر — DZ HOOF</h2>
<table style="width:100%;border-collapse:collapse;margin:12px 0">
  <tr>
    <td style="padding:8px;border:1px solid #ddd;background:#f5f5f5"><strong>الحدث</strong></td>
    <td style="padding:8px;border:1px solid #ddd" dir="ltr">{{event}}</td>
  </tr>
  <tr>
    <td style="padding:8px;border:1px solid #ddd;background:#f5f5f5"><strong>الخطورة</strong></td>
    <td style="padding:8px;border:1px solid #ddd">{{severity}}</td>
  </tr>
  <tr>
    <td style="padding:8px;border:1px solid #ddd;background:#f5f5f5"><strong>الوقت</strong></td>
    <td style="padding:8px;border:1px solid #ddd" dir="ltr">{{time}} (UTC)</td>
  </tr>
</table>
<h3>التفاصيل</h3>
<pre style="white-space:pre-wrap;background:#fafafa;padding:10px;border-radius:6px" dir="rtl">{{message}}</pre>
<p>راجع لوحة الإدارة ← المصادر ← الصحة، أو سجل الخادم.</p>
