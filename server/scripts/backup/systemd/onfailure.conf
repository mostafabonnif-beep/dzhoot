[Unit]
# Fail-closed alerting for the backup units.
#
# A backup job that fails quietly is indistinguishable from one that works — right up
# until you need it. Install this as a drop-in for every `dzhoof-restic-*` unit:
#
#   /etc/systemd/system/dzhoof-restic-offsite-backup.service.d/onfailure.conf
#   /etc/systemd/system/dzhoof-restic-offsite-check.service.d/onfailure.conf
#   /etc/systemd/system/dzhoof-restic-local-backup.service.d/onfailure.conf
#
# `%n` is the failed unit's name, so the alert names what broke. Measured 2026-09-26:
# the drop-ins existed on the production host but were not versioned here, so any
# reinstall of the units would have silently dropped the alerting.
OnFailure=dzhoof-alert-failure@%n.service
