name: CI
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'chore/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'HTTPS API base URL for a manual Android debug build'
        required: false
        type: string
        default: 'https://8009-i11yovu3v9kwp3b77gc99-9aaf8799.us4.manus.computer/'
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:backend
      - name: Validate production compose
        working-directory: server
        env:
          DOMAIN: example.com
          ACME_EMAIL: ops@example.com
          DOCKER_IMAGE: example/backend:ci
          DOCKER_FRONTEND_IMAGE: example/frontend:ci
          MONGO_INITDB_ROOT_USERNAME: ci-admin
          MONGO_INITDB_ROOT_PASSWORD: ci-mongodb-password
          REDIS_PASSWORD: ci-redis-password
          JWT_ACCESS_SECRET: ci-jwt-access-secret-32-characters-long
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret-32-characters-long
          XTREAM_SECRET_KEY: ci-xtream-secret-32-characters-long
          PLAYBACK_TOKEN_SECRET: ci-playback-secret-32-characters-long
          TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SUPER_ADMIN_USERNAME: ci-admin
          SUPER_ADMIN_PASSWORD: ci-admin-password
          SUPER_ADMIN_EMAIL: ci@example.com
          SUPER_ADMIN_CHANNEL_LIST_CODE: ci-channel-code
          PUBLIC_BASE_URL: https://example.com
          ALLOWED_ORIGINS: https://example.com
          APP_URL: https://example.com
        run: |
          docker compose config --quiet
      - name: E2E smoke (subscription loop)
        run: npx tsx scripts/smoke-activation.ts
        working-directory: server/backend
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble Android debug APK
        working-directory: android
        env:
          DZHOOF_API_URL: ${{ inputs.api_url || 'https://8009-i11yovu3v9kwp3b77gc99-9aaf8799.us4.manus.computer/' }}
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dzhoof-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build -w @firevision/frontend
      - run: npm run test:frontend
