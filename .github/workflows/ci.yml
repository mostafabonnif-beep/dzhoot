name: DZ HOOF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed files via the API — required on
  # private repos (public repos grant this implicitly).
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            backend:
              - 'server/backend/**'
              - 'server/packages/**'
              - 'server/package.json'
              - 'server/package-lock.json'
              - 'server/tsconfig*.json'
            android:
              - 'android/**'
            frontend:
              - 'server/frontend/**'
              - 'server/package.json'
              - 'server/package-lock.json'
              - 'server/tsconfig*.json'

  secret-guard:
    name: Secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject tracked private keys and access tokens
        run: bash scripts/security/check-secrets.sh
      - name: Test the release-manifest generator (fails closed)
        run: bash scripts/ci/test-write-release-manifest.sh
      - name: Test the Android unit-test result verifier (fails closed)
        run: bash scripts/ci/test-verify-android-test-results.sh
      - name: Test the egress relay hardening (no 0.0.0.0, no --allow-only any)
        run: bash scripts/ci/test-relay-unit-hardening.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/dzhoof_test
    services:
      mongodb:
        image: mongo:7.0.19
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:backend
      - name: Test operational readiness guard
        run: bash scripts/ops/test-operational-readiness.sh
      - name: Audit production dependencies (tolerates npm registry outages)
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then exit 0; fi
            echo "audit attempt $attempt failed - retrying in 30s"
            sleep 30
          done
          # Three retries exhausted. A registry outage (503/400) is not a finding:
          # fail only if an actual vulnerability report rendered.
          if npm audit --omit=dev --audit-level=high 2>&1 | grep -qiE 'severity|vulnerabilit'; then
            exit 1
          fi
          echo "::warning::npm audit endpoint unavailable - skipping audit (registry outage)"
      - run: npm run test:backend
      - name: E2E smoke (subscription loop)
        run: npx tsx scripts/smoke-activation.ts
        working-directory: server/backend
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # lint runs over every variant once it is in the graph, so the budget is
    # wider than the old lintStagingDebug-only job.
    timeout-minutes: 35
    env:
      # The uploaded APK is a distributable staging build. It must point at the
      # managed production API; a placeholder hostname makes device activation fail.
      DZHOOF_API_URL: https://iptv.ld-11.net/
      # The version the CI build advertises. Kept a repository variable so the
      # workflow does not have to be edited for every release candidate.
      ANDROID_VERSION_NAME: ${{ vars.DZHOOF_ANDROID_VERSION_NAME || '1.3.1' }}
      # Pinned command-line tools. The action's own default moves with upstream;
      # pinning keeps the runner reproducible (see the job history note below).
      ANDROID_CMDLINE_TOOLS_VERSION: '14742923'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Firebase configuration is external
        run: |
          set -euo pipefail
          if git ls-files | grep -q 'google-services\.json'; then
            echo 'google-services.json must not be committed; use CI secrets instead.' >&2
            exit 1
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # `packages` is set explicitly on purpose. The action defaults to
      # "tools platform-tools", and the legacy `tools` package no longer exists
      # in the SDK repository: sdkmanager exits 1 with
      #   Warning: Failed to find package 'tools'
      # which failed this job at the setup step, before anything was built
      # (run 34970591122 on 460b8cc). Requesting only what we install keeps the
      # job independent of a package that upstream has removed.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: 'platform-tools'
          cmdline-tools-version: ${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          # Only the platform and build-tools this project declares in
          # android/app/build.gradle.kts (compileSdk 34 / targetSdk 34).
          if ! sdkmanager "platforms;android-34" "build-tools;34.0.0"; then
            echo "::group::sdkmanager diagnostics (no secrets)"
            sdkmanager --version || true
            sdkmanager --list_installed || true
            # `sdkmanager --list` is ~5k lines; the filter keeps the diagnostic
            # useful in the log while still proving whether the package exists.
            sdkmanager --list 2>&1 | grep -E 'platforms;android-34|build-tools;34\.0\.0' || true
            echo "::endgroup::"
            exit 1
          fi
          sdkmanager --list_installed
      # The release gate runs the same task set the operations brief verifies on
      # the build host (docs/AI_AGENT_OPERATIONS_AR.md §2): compiling the
      # official release variant proves the R8/proguard path, the unit tests run
      # on the staging variant, and lint covers the app module. `assembleStagingDebug`
      # below still produces the downloadable staging APK.
      - name: Android build, unit tests and lint
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew \
            :app:compileOfficialReleaseKotlin \
            :app:testStagingDebugUnitTest \
            :app:lint \
            --no-daemon --stacktrace \
            -PversionName="${ANDROID_VERSION_NAME}" \
            -PdzhoofApiUrl="${DZHOOF_API_URL}"
      # A green Gradle invocation is not proof that tests ran: Gradle reports
      # success for an up-to-date/empty test task too. Read the JUnit XML.
      - name: Verify unit-test results (XML)
        if: always()
        run: bash scripts/ci/verify-android-test-results.sh android/app/build/test-results/testStagingDebugUnitTest
      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew assembleStagingDebug --stacktrace -PversionName="${ANDROID_VERSION_NAME}" -PdzhoofApiUrl="${DZHOOF_API_URL}"
      # Assert the artifact exists *before* the best-effort upload step, so a
      # broken build can never be hidden by an upload that tolerates failure.
      - name: Verify the staging APK exists
        working-directory: android
        run: |
          set -euo pipefail
          ls -l app/build/outputs/apk/staging/debug/*.apk
          test -s "$(ls app/build/outputs/apk/staging/debug/*.apk | head -1)"
      - name: Upload Android debug APK
        # Best-effort: the APK is a CI convenience, not a release gate. Keep
        # CI green when the account artifact-storage quota is exhausted; the
        # build itself above remains the real check.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: true
        with:
          name: dzhoof-staging-production-apk
          path: android/app/build/outputs/apk/staging/debug/*.apk
          if-no-files-found: error

  # TODO(android-tv): an emulator/instrumentation job (Android TV system image,
  # `connectedAndroidTest` on the `official` flavour) belongs here once a runner
  # with hardware acceleration is available. The hosted ubuntu runner cannot run
  # an Android TV AVD with nested virtualisation, so it stays a separate future
  # job rather than a gate that would fail for environmental reasons.

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint -w @dzhoof/frontend
      - run: npm run build -w @dzhoof/frontend
      - run: npm run test:frontend
      - name: Audit production dependencies (tolerates npm registry outages)
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then exit 0; fi
            echo "audit attempt $attempt failed - retrying in 30s"
            sleep 30
          done
          # Three retries exhausted. A registry outage (503/400) is not a finding:
          # fail only if an actual vulnerability report rendered.
          if npm audit --omit=dev --audit-level=high 2>&1 | grep -qiE 'severity|vulnerabilit'; then
            exit 1
          fi
          echo "::warning::npm audit endpoint unavailable - skipping audit (registry outage)"
