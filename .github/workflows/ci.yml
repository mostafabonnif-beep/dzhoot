name: DZ HOOF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node scripts/check-workspace-scopes.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:backend
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:backend
      - name: E2E smoke (subscription loop)
        run: npx tsx scripts/smoke-activation.ts
        working-directory: server/backend
      - name: E2E smoke (M3U import loop)
        run: npx tsx scripts/smoke-m3u-import.ts
        working-directory: server/backend
      - name: Security smoke (device credential lifecycle)
        run: npm run smoke:device-security
        working-directory: server/backend
      - name: Golden E2E (subscription → device → playback → revoke)
        run: npm run smoke:golden-e2e
        working-directory: server/backend
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify Firebase configuration is external
        run: |
          set -euo pipefail
          if git ls-files | grep -q 'google-services\.json'; then
            echo 'google-services.json must not be committed; use CI secrets instead.' >&2
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run Android lint and unit tests
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest --stacktrace -PdzhoofApiUrl=https://example.invalid/
      - name: Assemble Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace -PdzhoofApiUrl=https://example.invalid/
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dzhoof-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint -w @dzhoof/frontend
      - run: npm run build -w @dzhoof/frontend
      - run: npm run test:frontend
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile
          push: false
          tags: dzhoof-api:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile.frontend
          push: false
          tags: dzhoof-frontend:ci
      - name: Validate self-host Compose
        run: docker compose --env-file server/.env.example -f server/docker-compose.selfhost.yml config >/tmp/dzhoof-compose-config.yml
      - name: Validate production Compose
        run: docker compose --env-file server/.env.production.example -f server/docker-compose.production.yml config >/tmp/dzhoof-production-compose-config.yml
      - name: Check Dockerfile runtime versions
        run: |
          grep -q '^FROM node:20-alpine' server/Dockerfile
          grep -q '^FROM node:20-alpine' server/Dockerfile.frontend
          grep -q 'next.*16\.3\.1' server/frontend/package-lock.json || true
          echo 'Docker runtime base images use Node 20.'
      - name: Remove generated config
        if: always()
        run: rm -f /tmp/dzhoof-compose-config.yml /tmp/dzhoof-production-compose-config.yml
