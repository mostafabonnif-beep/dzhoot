name: CI
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'chore/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Permanent HTTPS API base URL for the Android build'
        required: false
        type: string
        default: 'https://8009-i11yovu3v9kwp3b77gc99-9aaf8799.us4.manus.computer/'
      build_release:
        description: 'Build and upload a signed Android Release APK'
        required: false
        type: boolean
        default: false
      version_code:
        description: 'Android versionCode for the Release APK'
        required: false
        type: string
        default: '6'
      version_name:
        description: 'Android versionName for the Release APK'
        required: false
        type: string
        default: '1.6.0'
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:backend
      - name: Validate production compose
        working-directory: server
        env:
          DOMAIN: example.com
          ACME_EMAIL: ops@example.com
          DOCKER_IMAGE: example/backend:ci
          DOCKER_FRONTEND_IMAGE: example/frontend:ci
          MONGO_INITDB_ROOT_USERNAME: ci-admin
          MONGO_INITDB_ROOT_PASSWORD: ci-mongodb-password
          REDIS_PASSWORD: ci-redis-password
          JWT_ACCESS_SECRET: ci-jwt-access-secret-32-characters-long
          JWT_REFRESH_SECRET: ci-jwt-refresh-secret-32-characters-long
          XTREAM_SECRET_KEY: ci-xtream-secret-32-characters-long
          PLAYBACK_TOKEN_SECRET: ci-playback-secret-32-characters-long
          TOTP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          SUPER_ADMIN_USERNAME: ci-admin
          SUPER_ADMIN_PASSWORD: ci-admin-password
          SUPER_ADMIN_EMAIL: ci@example.com
          SUPER_ADMIN_CHANNEL_LIST_CODE: ci-channel-code
          PUBLIC_BASE_URL: https://example.com
          ALLOWED_ORIGINS: https://example.com
          APP_URL: https://example.com
        run: |
          docker compose config --quiet
      - name: E2E smoke (subscription loop)
        run: npx tsx scripts/smoke-activation.ts
        working-directory: server/backend
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble Android debug APK
        working-directory: android
        env:
          DZHOOF_API_URL: ${{ inputs.api_url || 'https://8009-i11yovu3v9kwp3b77gc99-9aaf8799.us4.manus.computer/' }}
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dzhoof-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode Firebase configuration for Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release == true }}
        working-directory: android
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" || { echo 'Missing ANDROID_GOOGLE_SERVICES_JSON_BASE64'; exit 1; }
          mkdir -p app/src/release
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/src/release/google-services.json

      - name: Decode Release keystore
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release == true }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/release.keystore
          chmod 600 signing/release.keystore

      - name: Assemble signed Android Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release == true }}
        working-directory: android
        env:
          DZHOOF_API_URL: ${{ inputs.api_url }}
          SIGNING_KEY_STORE: ${{ github.workspace }}/android/signing/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.ANDROID_SENTRY_DSN }}
        run: |
          test -n "$DZHOOF_API_URL" || { echo 'Missing permanent API URL'; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo 'Missing SIGNING_STORE_PASSWORD'; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo 'Missing SIGNING_KEY_ALIAS'; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo 'Missing SIGNING_KEY_PASSWORD'; exit 1; }
          ./gradlew assembleRelease --stacktrace \
            -PdzhoofApiUrl="$DZHOOF_API_URL" \
            -PversionCode="${{ inputs.version_code }}" \
            -PversionName="${{ inputs.version_name }}"

      - name: Verify signed Android Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release == true }}
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK" || { echo 'Release APK not found'; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload Android Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: dzhoof-release-apk-v${{ inputs.version_name }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build -w @firevision/frontend
      - run: npm run test:frontend
