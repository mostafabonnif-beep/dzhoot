name: DZ HOOF CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      android: ${{ steps.filter.outputs.android }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            backend:
              - 'server/backend/**'
              - 'server/packages/**'
              - 'server/package.json'
              - 'server/package-lock.json'
              - 'server/tsconfig*.json'
            android:
              - 'android/**'
            frontend:
              - 'server/frontend/**'
              - 'server/package.json'
              - 'server/package-lock.json'
              - 'server/tsconfig*.json'

  secret-guard:
    name: Secret guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reject tracked private keys and access tokens
        run: bash scripts/security/check-secrets.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/dzhoof_test
    services:
      mongodb:
        image: mongo:7.0.19
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:backend
      - name: Test operational readiness guard
        run: bash scripts/ops/test-operational-readiness.sh
      - name: Audit production dependencies (tolerates npm registry outages)
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then exit 0; fi
            echo "audit attempt $attempt failed - retrying in 30s"
            sleep 30
          done
          # Three retries exhausted. A registry outage (503/400) is not a finding:
          # fail only if an actual vulnerability report rendered.
          if npm audit --omit=dev --audit-level=high 2>&1 | grep -qiE 'severity|vulnerabilit'; then
            exit 1
          fi
          echo "::warning::npm audit endpoint unavailable - skipping audit (registry outage)"
      - run: npm run test:backend
      - name: E2E smoke (subscription loop)
        run: npx tsx scripts/smoke-activation.ts
        working-directory: server/backend
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify Firebase configuration is external
        run: |
          set -euo pipefail
          if git ls-files | grep -q 'google-services\.json'; then
            echo 'google-services.json must not be committed; use CI secrets instead.' >&2
            exit 1
          fi
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      # The uploaded APK is a distributable staging build. It must point at the
      # managed production API; a placeholder hostname makes device activation fail.
      - name: Run Android lint and unit tests
        working-directory: android
        env:
          DZHOOF_API_URL: https://iptv.ld-11.net/
        run: ./gradlew lintStagingDebug testStagingDebugUnitTest --stacktrace
      - name: Assemble Android debug APK
        working-directory: android
        env:
          DZHOOF_API_URL: https://iptv.ld-11.net/
        run: ./gradlew assembleStagingDebug --stacktrace
      - name: Upload Android debug APK
        # Best-effort: the APK is a CI convenience, not a release gate. Keep
        # CI green when the account artifact-storage quota is exhausted; the
        # build itself above remains the real check.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        continue-on-error: true
        with:
          name: dzhoof-staging-production-apk
          path: android/app/build/outputs/apk/staging/debug/*.apk
          if-no-files-found: error

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint -w @dzhoof/frontend
      - run: npm run build -w @dzhoof/frontend
      - run: npm run test:frontend
      - name: Audit production dependencies (tolerates npm registry outages)
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then exit 0; fi
            echo "audit attempt $attempt failed - retrying in 30s"
            sleep 30
          done
          # Three retries exhausted. A registry outage (503/400) is not a finding:
          # fail only if an actual vulnerability report rendered.
          if npm audit --omit=dev --audit-level=high 2>&1 | grep -qiE 'severity|vulnerabilit'; then
            exit 1
          fi
          echo "::warning::npm audit endpoint unavailable - skipping audit (registry outage)"
