name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name, for example 1.0.0-rc.1'
        required: true
        type: string
      api_url:
        description: 'HTTPS API base URL for the APK'
        required: true
        type: string

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore Firebase configuration when supplied
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            chmod 600 android/app/google-services.json
            grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.dzhoof.iptv"' android/app/google-services.json
          else
            echo 'Firebase config is required for a release candidate.' >&2
            exit 1
          fi
          [ -s android/app/google-services.json ] || { echo 'Missing GOOGLE_SERVICES_JSON_BASE64: release candidate must include Firebase configuration.' >&2; exit 1; }

      - name: Validate Android identity and API URL
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.dzhoof.iptv"' android/app/build.gradle.kts
          case "$API_URL" in https://*) ;; *) echo 'api_url must use HTTPS' >&2; exit 1 ;; esac

      - name: Validate version_name format
        # version_name is interpolated into shell commands below (gradle -P and
        # grep) whose step env carries the signing secrets — shell metacharacters
        # would be a runner RCE + signing-key exfiltration (security audit).
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          case "$VERSION_NAME" in
            [0-9]*.[0-9]*.[0-9]*)
              ;;
            *)
              echo 'version_name must look like X.Y.Z or X.Y.Z-suffix (e.g. 1.0.0-rc.1)' >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$'; then
            echo 'version_name must match ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$' >&2
            exit 1
          fi

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
          done

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dzhoof-release.keystore"
          chmod 600 "$RUNNER_TEMP/dzhoof-release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          SIGNING_KEY_STORE: ${{ runner.temp }}/dzhoof-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          DZHOOF_API_URL: ${{ inputs.api_url }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew assembleRelease --stacktrace -PversionName="$VERSION_NAME"


      - name: Verify and package official release APK
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/official/release/app-official-release.apk
          test -s "$APK"
          SDK_BUILD_TOOLS="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "package: name='com.dzhoof.iptv'"
          VERSION_NAME="${{ inputs.version_name }}"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | grep -q "versionName='$VERSION_NAME'"
          sha256sum "$APK" > app-official-release.apk.sha256
          ls -lh "$APK" app-official-release.apk.sha256

      - name: Upload official signed release APK
        uses: actions/upload-artifact@v7
        with:
          name: dzhoof-official-release-${{ inputs.version_name }}
          # Only the official application is distributable to customers. The
          # staging flavor is intentionally excluded to prevent wrong-package
          # installation attempts and Play Protect confusion.
          path: |
            android/app/build/outputs/apk/official/release/app-official-release.apk
            android/app/app-official-release.apk.sha256
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dzhoof-release.keystore"
          rm -f android/app/google-services.json
