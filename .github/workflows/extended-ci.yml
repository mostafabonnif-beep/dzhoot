name: DZ HOOF Extended CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node scripts/check-workspace-scopes.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint -w @dzhoof/frontend
      - run: npm audit --omit=dev --audit-level=high

  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: server
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:backend -- --coverage
        env:
          REDIS_URL: redis://localhost:6379
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@13ce06bfc6bbe3ecf90edbbf1bc32fe5978ca1d1
        with:
          files: server/backend/coverage/lcov.info
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:frontend
      - run: npm run build -w @dzhoof/frontend

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build DZ HOOF API image
        working-directory: server
        run: docker build -t dzhoof-server:ci .
