name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, for example 1.0.45'
        required: true
        type: string
      api_url:
        description: 'HTTPS API base URL for the APK'
        required: false
        default: 'https://iptv.ld-11.net/'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Resolve release inputs
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_API_URL: ${{ inputs.api_url }}
          TAG_NAME: ${{ github.ref_name }}
          API_URL_VARIABLE: ${{ vars.DZHOOF_API_URL }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${TAG_NAME#v}"
            api_url="${API_URL_VARIABLE:-}"
          else
            version="${INPUT_VERSION}"
            api_url="${INPUT_API_URL:-${API_URL_VARIABLE:-}}"
          fi
          [ -n "$version" ] || { echo 'Release version is required' >&2; exit 1; }
          case "$api_url" in https://*) ;; *) echo 'API URL must use HTTPS' >&2; exit 1 ;; esac
          printf 'VERSION=%s\nAPI_URL=%s\n' "$version" "$api_url" >> "$GITHUB_ENV"

      - name: Restore Firebase configuration when supplied
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            chmod 600 android/app/google-services.json
            grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.dzhoof.iptv"' android/app/google-services.json
          fi

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "Missing required release secret: $name" >&2; exit 1; }
          done

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dzhoof-release.keystore"
          chmod 600 "$RUNNER_TEMP/dzhoof-release.keystore"

      - name: Build signed official APK
        working-directory: android
        env:
          SIGNING_KEY_STORE: ${{ runner.temp }}/dzhoof-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          DZHOOF_API_URL: ${{ env.API_URL }}
        run: ./gradlew assembleOfficialRelease --stacktrace --no-daemon -PversionName="${VERSION}"

      - name: Verify and checksum APK
        working-directory: android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/official/release/app-official-release.apk
          test -s "$apk"
          sdk_build_tools="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          "$sdk_build_tools/apksigner" verify --verbose "$apk"
          "$sdk_build_tools/aapt" dump badging "$apk" | grep -q "package: name='com.dzhoof.iptv'"
          "$sdk_build_tools/aapt" dump badging "$apk" | grep -q "versionName='${VERSION}'"
          sha256sum "$apk" > app-official-release.apk.sha256

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DZ HOOF v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/official/release/app-official-release.apk
            android/app-official-release.apk.sha256

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dzhoof-release.keystore"
          rm -f android/app/google-services.json
