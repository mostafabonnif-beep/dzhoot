name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version, for example 1.0.45'
        required: true
        type: string
      api_url:
        description: 'HTTPS API base URL for the APK'
        required: false
        default: 'https://iptv.ld-11.net/'
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Resolve release inputs
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_API_URL: ${{ inputs.api_url }}
          TAG_NAME: ${{ github.ref_name }}
          API_URL_VARIABLE: ${{ vars.DZHOOF_API_URL }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${TAG_NAME#v}"
            api_url="${API_URL_VARIABLE:-https://iptv.ld-11.net/}"
            [ -n "${API_URL_VARIABLE:-}" ] || echo "::warning title=API URL fallback::Repository variable DZHOOF_API_URL is not set; falling back to https://iptv.ld-11.net/"
          else
            version="${INPUT_VERSION}"
            api_url="${INPUT_API_URL:-${API_URL_VARIABLE:-https://iptv.ld-11.net/}}"
          fi
          [ -n "$version" ] || { echo 'Release version is required' >&2; exit 1; }
          case "$api_url" in https://*) ;; *) echo "API URL must use HTTPS (got: $api_url)" >&2; exit 1 ;; esac
          printf 'VERSION=%s\nAPI_URL=%s\n' "$version" "$api_url" >> "$GITHUB_ENV"

      # Validate every required secret up front and report all gaps at once —
      # failing later (as this workflow used to) hid which secrets were missing.
      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Missing release secrets::Add these repository secrets (Settings → Secrets and variables → Actions): ${missing[*]}"
            exit 1
          fi
          echo "All required signing secrets are present."

      # Firebase is OPTIONAL: android/app/build.gradle.kts applies the Firebase
      # plugins only when a google-services.json is present, so the app builds
      # (without FCM push / Analytics / Crashlytics) when the secret is absent.
      # Set the repository variable REQUIRE_FIREBASE=true to make it mandatory.
      - name: Restore Firebase configuration (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          REQUIRE_FIREBASE: ${{ vars.REQUIRE_FIREBASE }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            chmod 600 android/app/google-services.json
            grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.dzhoof.iptv"' android/app/google-services.json \
              || { echo 'google-services.json does not declare package com.dzhoof.iptv' >&2; exit 1; }
            echo "Firebase configuration restored — the APK will include FCM, Analytics and Crashlytics."
          elif [ "${REQUIRE_FIREBASE:-}" = "true" ]; then
            echo "::error title=Firebase required::REQUIRE_FIREBASE=true but GOOGLE_SERVICES_JSON_BASE64 is not set."
            exit 1
          else
            echo "::warning title=Building without Firebase::GOOGLE_SERVICES_JSON_BASE64 is not set — the APK will ship without FCM push, Analytics and Crashlytics."
          fi

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dzhoof-release.keystore"
          chmod 600 "$RUNNER_TEMP/dzhoof-release.keystore"

      - name: Build signed official APK
        working-directory: android
        env:
          SIGNING_KEY_STORE: ${{ runner.temp }}/dzhoof-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          DZHOOF_API_URL: ${{ env.API_URL }}
        run: ./gradlew assembleOfficialRelease --stacktrace --no-daemon -PversionName="${VERSION}"

      - name: Verify and checksum APK
        working-directory: android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/official/release/app-official-release.apk
          test -s "$apk"
          sdk_build_tools="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          "$sdk_build_tools/apksigner" verify --verbose "$apk"
          "$sdk_build_tools/aapt" dump badging "$apk" | grep -q "package: name='com.dzhoof.iptv'"
          "$sdk_build_tools/aapt" dump badging "$apk" | grep -q "versionName='${VERSION}'"
          # Publish every release under the same self-describing name pattern, so
          # a downloaded file (and the checksum next to it) says which version it
          # is — v1.2.3 shipped as dzhoof-tv-v1.2.3-official.apk, while the
          # workflow was still uploading app-official-release.apk.
          named="dzhoof-tv-v${VERSION}-official.apk"
          cp "$apk" "$named"
          sha256sum "$named" > "${named}.sha256"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: v${{ env.VERSION }}
          name: DZ HOOF v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            android/dzhoof-tv-v${{ env.VERSION }}-official.apk
            android/dzhoof-tv-v${{ env.VERSION }}-official.apk.sha256

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/dzhoof-release.keystore"
          rm -f android/app/google-services.json
